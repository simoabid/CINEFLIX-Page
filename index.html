<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINEFLIX — Unlimited Movies & Shows</title>
  <meta name="description" content="Your premium movie and TV companion. Discover, stream, collect, and track — powered by TMDB. Built with React Native + Expo.">
  
  <!-- OpenGraph / Facebook -->
  <meta property="og:title" content="CINEFLIX — Unlimited Movies & Shows">
  <meta property="og:description" content="Your premium movie and TV companion. Discover, stream, collect, and track.">
  <meta property="og:image" content="/assets/og-image.png">
  <meta property="og:type" content="website">
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  
  <!-- Favicon -->
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  
  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "CINEFLIX",
    "operatingSystem": "Android",
    "applicationCategory": "MultimediaApplication",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "description": "Your premium movie and TV companion. Discover, stream, collect, and track — powered by TMDB.",
    "author": { "@type": "Person", "name": "ABID.Dev" },
    "url": "https://github.com/simoabid/CINEFLIX-Mobile"
  }
  </script>
  
  <!-- Fonts and Icon Packages -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/devicon@2.16.0/devicon.min.css">
</head>
<body class="bg-background-primary text-white">
  <!-- React App Mount Point -->
  <div id="root"></div>
  
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
